name: MediQueue Web · Test and Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript and simulated user flows
        run: |
          node --check auth-v4.js
          node --check app.js
          node --check booking-flow.js
          node tests/booking-flow.mjs
          node --check ticket-qr.js
          node --check vendor/qrcode.js
          node tests/ticket-qr.mjs
          node tests/auth-v4.mjs
          node tests/password-recovery.mjs
          node --check supabase-client.js
          node tests/smoke.mjs
          node tests/staff-portal.mjs
          node tests/cloud-contract.mjs
          node tests/auth-callback.mjs
          node tests/session-races.mjs
          node tests/live-anon.mjs
      - name: Build public website files only
        run: |
          mkdir -p _site/assets
          cp index.html staff.html admin.html scan.html scan.js scan.css auth-v4.js auth-v4.css patient-landing.css styles.css dashboard.css premium-sidebar.css integration.css booking-flow.css booking-flow.js ticket-qr.js app.js premium-sidebar.js access.js supabase-client.js config.js .nojekyll _site/
          cp assets/logo.svg assets/mark.svg _site/assets/
          cp -R vendor _site/vendor
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4


